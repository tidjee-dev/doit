name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Test
        run: go test ./...

      - name: Go Vet
        run: go vet ./...

      - name: Go Build
        run: go build ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - name: Docs Install
        working-directory: docs-site
        run: npm ci

      - name: Docs Typecheck
        working-directory: docs-site
        run: npm run typecheck

      - name: Docs Build
        working-directory: docs-site
        run: npm run build
