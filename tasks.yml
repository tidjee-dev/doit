# yaml-language-server: $schema=https://raw.githubusercontent.com/tidjee-dev/doit/main/schema.json
# See doc at https://github.com/tidjee-dev/doit

app:
  name: doit
  version: v0.1.0
  description: A task runner written in Go
  main_file: main.go
  author:
    - Tidjee
  repo_url: https://github.com/tidjee-dev/doit

env:
  BIN_DIR: bin

tasks:
  deps:
    category: Dependencies
    description: Install and tidy dependencies
    commands:
      - go mod download
      - go mod tidy

  build:
    category: Build
    description: Compile the application for the current platform
    depends_on:
      - deps
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }} {{ .App.MainFile }}

  build-linux:
    category: Build
    description: Compile the application for Linux
    depends_on:
      - deps
    env:
      GOOS: linux
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-linux {{ .App.MainFile }}

  build-windows:
    category: Build
    description: Compile the application for Windows
    depends_on:
      - deps
    env:
      GOOS: windows
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-windows.exe {{ .App.MainFile }}

  build-mac-intel:
    category: Build
    description: Compile the application for macOS (Intel)
    depends_on:
      - deps
    env:
      GOOS: darwin
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-mac-intel {{ .App.MainFile }}

  build-mac-arm:
    category: Build
    description: Compile the application for macOS (Apple Silicon)
    depends_on:
      - deps
    env:
      GOOS: darwin
      GOARCH: arm64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-mac-arm {{ .App.MainFile }}

  dev:
    category: Development
    description: Run the application locally for development
    depends_on:
      - deps
    commands:
      - go run {{ .App.MainFile }}

  test:
    category: Quality
    description: Run all tests
    commands:
      - go test ./...

  fmt:
    category: Quality
    description: Format code
    commands:
      - gofmt -w $(go list -f '{{.Dir}}' ./...)

  lint:
    category: Quality
    description: Run linter
    commands:
      - golangci-lint run

  vet:
    category: Quality
    description: Static analysis
    commands:
      - go vet ./...
