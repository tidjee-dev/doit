      # - echo '{{ ternary "set" "unset" .Env.MISSING }}'
      - echo '{{ ternary "unset" "set" (empty .Env.MISSING) }}'
      - echo '{{ ternary "set" "unset" (ne .Env.MISSING "") }}'

  test-templates:
    category: Development
    description: Test all built-in Go template actions and functions
    env:
      FOO: bar
      EMPTY: ""
    quiet: true
    commands:
      # --------------------------------------------------
      # Basic values
      # --------------------------------------------------
      - echo "App.Name={{ .App.Name }}"
      - echo "Task.Name={{ .Task.Name }}"

      # --------------------------------------------------
      # Variables
      # --------------------------------------------------
      - echo "{{ $v := .App.Version }}VersionVar={{ $v }}"

      # --------------------------------------------------
      # if / else
      # --------------------------------------------------
      - echo "{{ if .App.RepoURL }}HasRepo{{ else }}NoRepo{{ end }}"
      - echo "{{ if .Env.EMPTY }}ShouldNotPrint{{ else }}EmptyEnvOK{{ end }}"

      # --------------------------------------------------
      # with
      # --------------------------------------------------
      - echo "{{ with .App }}With={{ .Name }}@{{ .Version }}{{ end }}"

      # --------------------------------------------------
      # range (slice)
      # --------------------------------------------------
      - echo "Authors:"
      - echo "{{ range .App.Authors }}- {{ . }} {{ end }}"

      # --------------------------------------------------
      # range with index
      # --------------------------------------------------
      - echo "{{ range $i, $a := .App.Authors }}{{ $i }}={{ $a }} {{ end }}"

      # --------------------------------------------------
      # range (map)
      # --------------------------------------------------
      - echo "Authors:"
      - echo "{{ range $k, $v := .App.Authors }}{{ $k }}={{ $v }} {{ end }}"

      # --------------------------------------------------
      # len
      # --------------------------------------------------
      - echo "AuthorCount={{ len .App.Authors }}"

      # --------------------------------------------------
      # index
      # --------------------------------------------------
      - echo "FirstAuthor={{ index .App.Authors 0 }}"
      - echo "BIN_DIR={{ index .Env "BIN_DIR" }}"

      # --------------------------------------------------
      # comparisons
      # --------------------------------------------------
      - echo "{{ if eq .App.Version "v0.2.0" }}EqOK{{ end }}"
      - echo "{{ if ne .Task.Category "Build" }}NeOK{{ end }}"
      - echo "{{ if gt (len .App.Authors) 1 }}GtOK{{ end }}"
      - echo "{{ if ge (len .App.Authors) 2 }}GeOK{{ end }}"
      - echo "{{ if lt 1 2 }}LtOK{{ end }}"
      - echo "{{ if le 2 2 }}LeOK{{ end }}"

      # --------------------------------------------------
      # boolean logic
      # --------------------------------------------------
      - echo "{{ if and .App.Name .App.Version }}AndOK{{ end }}"
      - echo "{{ if or .Env.FOO .Env.MISSING }}OrOK{{ end }}"
      - echo "{{ if not .Env.MISSING }}NotOK{{ end }}"

      # --------------------------------------------------
      # printf
      # --------------------------------------------------
      - echo "{{ printf "App=%s Version=%s" .App.Name .App.Version }}"

      # --------------------------------------------------
      # pipeline
      # --------------------------------------------------
      - echo "{{ .App.Version | printf "[%s]" }}"

      # --------------------------------------------------
      # define / template
      # --------------------------------------------------
      - echo '{{ define "authors" }}{{ range . }}{{ . }}, {{ end }}{{ end }}{{ template "authors" .App.Authors }}'

  test-env:
    category: Development
    description: Print the current environment
    env:
      BIN_DIR: dist
    commands:
      - echo $BIN_DIR
      - echo {{ .Env.BIN_DIR }}
      - echo {{ .Task.Name }}
      - echo {{ .Task.Category }}
      - echo {{ .Task.Description }}
      - echo {{ .App.Name }}
      - echo {{ .App.Version }}
      - echo {{ .App.Description }}
      - echo {{ .App.MainFile }}
      - echo {{ .App.RepoURL }}
      - echo {{ range .App.Authors }}{{ . }} {{ end }}

  deps:
    category: Dependencies
    description: Install and tidy dependencies
    commands:
      - go mod download
      - go mod tidy

  build:
    category: Build
    description: Compile the application for the current platform
    depends_on:
      - deps
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }} {{ .App.MainFile }}

  build-linux:
    category: Build
    description: Compile the application for Linux
    depends_on:
      - deps
    env:
      GOOS: linux
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-linux {{ .App.MainFile }}

  build-windows:
    category: Build
    description: Compile the application for Windows
    depends_on:
      - deps
    env:
      GOOS: windows
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-windows.exe {{ .App.MainFile }}

  build-mac-intel:
    category: Build
    description: Compile the application for macOS (Intel)
    depends_on:
      - deps
    env:
      GOOS: darwin
      GOARCH: amd64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-mac-intel {{ .App.MainFile }}

  build-mac-arm:
    category: Build
    description: Compile the application for macOS (Apple Silicon)
    depends_on:
      - deps
    env:
      GOOS: darwin
      GOARCH: arm64
    commands:
      - go build -o {{ .Env.BIN_DIR }}/{{ .App.Name }}-mac-arm {{ .App.MainFile }}

  dev:
    category: Development
    description: Run the application locally for development
    depends_on:
      - deps
    commands:
      - go run {{ .App.MainFile }}

  dev-quiet:
    category: Development
    description: Run the application locally for development
    depends_on:
      - deps
    quiet: true
    commands:
      - go run {{ .App.MainFile }}

  test:
    category: Quality
    description: Run all tests
    commands:
      - go test ./...

  fmt:
    category: Quality
    description: Format code
    commands:
      - gofmt -w .

  lint:
    category: Quality
    description: Run linter
    commands:
      - golangci-lint run

  vet:
    category: Quality
    description: Static analysis
    commands:
      - go vet ./...
