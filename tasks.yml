# yaml-language-server: $schema=https://raw.githubusercontent.com/tidjee-dev/doit/main/schema.json

app:
  name: doit
  version: v0.1.0
  description: A task runner written in Go
  main_file: main.go
  author: Tidjee
  repo_url: https://github.com/tidjee-dev/doit

tasks:
  deps:
    category: Dependencies
    description: Install and tidy dependencies
    commands:
      # - go env
      - go mod download
      - go mod tidy

  build-linux:
    category: Build
    description: Compile the application for Linux
    depends_on:
      - deps
    commands:
      - env GOOS=linux GOARCH=amd64 go build -o bin/doit-linux .

  build-windows:
    category: Build
    description: Compile the application for Windows
    depends_on:
      - deps
    commands:
      - env GOOS=windows GOARCH=amd64 go build -o bin/doit-windows.exe .

  build-mac-intel:
    category: Build
    description: Compile the application for macOS (Intel)
    depends_on:
      - deps
    commands:
      - env GOOS=darwin GOARCH=amd64 go build -o bin/doit-mac-intel .

  build-mac-arm:
    category: Build
    description: Compile the application for macOS (Apple Silicon)
    depends_on:
      - deps
    commands:
      - env GOOS=darwin GOARCH=arm64 go build -o bin/doit-mac-arm .

  dev:
    category: Development
    description: Run the application locally for development
    depends_on:
      - deps
    commands:
      - go run ./...

  test:
    category: Quality
    description: Run all tests
    commands:
      - go test ./...

  fmt:
    category: Quality
    description: Format code
    commands:
      - gofmt -w $(go list -f '{{.Dir}}' ./...)

  lint:
    category: Quality
    description: Run linter
    commands:
      - golangci-lint run

  vet:
    category: Quality
    description: Static analysis
    commands:
      - go vet ./...
