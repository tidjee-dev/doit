app:
  name: doit
  version: v0.2.0
  description: A task runner written in Go
  main_file: main.go
  authors:
    - Tidjee
    - Tidjee Dev
    - Tidjee Dev Team
  repo_url: https://github.com/tidjee-dev/doit

templates:
  sprig: true

env:
  BIN_DIR: bin

